<pl-solution-panel title="Closed-loop reduction"><p>For a unity-feedback loop $T=\frac{CG}{1+CG}$. With $C(s)=K$ and $G(s)=\frac{1}{s+a}$,</p><p>$T(s)=\frac{K/(s+a)}{1+K/(s+a)}=\frac{K}{s+a+K}$.</p><p>The pole moves from $-a$ to $-(a+K)$, so raising the gain speeds the loop up.</p></pl-solution-panel>
